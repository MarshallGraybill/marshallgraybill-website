<main class="project">
  <section class="project-head">
    <div class="kicker">Get in touch</div>
    <h1>Contact</h1>
    <p>For research collaborations, design and engineering work, or questions about a project, send a note and I'll get back to you.</p>
  </section>

  <div class="contact">
    <!--
      Messages are delivered by Web3Forms (web3forms.com), so the destination email
      address never appears in this page. To activate: get a free access key at
      web3forms.com using the inbox that should receive messages, then paste it below.
    -->
    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_ACCESS_KEY">
      <input type="hidden" name="subject" value="New message from marshallgraybill.com">
      <input type="hidden" name="from_name" value="marshallgraybill.com">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" required></div>
      <div class="field"><label for="email">Your email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="topic">Subject</label><input id="topic" name="topic" type="text"></div>
      <div class="field"><label for="message">Message</label><textarea id="message" name="message" required></textarea></div>

      <button class="send" type="submit">Send message →</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>

<footer class="site-footer">© Marshall Graybill</footer>
<script>
  const form = document.getElementById('contact-form');
  const status = document.getElementById('form-status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('.send');
    btn.disabled = true; status.className = 'form-status'; status.textContent = 'Sending…';
    const data = Object.fromEntries(new FormData(form));
    if (data.topic) data.subject = 'Website: ' + data.topic;
    try {
      const res = await fetch(form.action, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) });
      const json = await res.json();
      if (json.success) { form.reset(); status.className = 'form-status ok'; status.textContent = 'Thanks, your message was sent. I\'ll be in touch soon.'; }
      else throw new Error(json.message || 'Something went wrong');
    } catch (err) {
      status.className = 'form-status err'; status.textContent = 'Sorry, the message could not be sent. Please try again in a moment.';
    } finally { btn.disabled = false; }
  });
</script>
</body>
