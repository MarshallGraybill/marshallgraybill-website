<!doctype html><html><head><meta charset="utf-8"><title>Tile palette</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:28px;background:#f3f1ec;font:300 14px Jost,sans-serif;color:#1b1a18}
h1{font-weight:400;font-size:20px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 18px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.c img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block}
.sw{display:flex;align-items:center;gap:10px;margin-top:8px}
.sw i{width:44px;height:26px;border-radius:5px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw b{font-weight:400}.sw small{color:#77736b;display:block;font-size:12px}
.k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77736b;margin-top:2px}
</style></head><body>
<h1>Suggested re-render backgrounds · Japanese traditional colours</h1>
<div class="g" id="g"></div>
<script>
const P=[['PhD Research','research/cover.jpg','#80ABA9','水浅葱 Mizuasagi','water blue · done in mockup'],
['Chembotix','projects/chembotix/cover.jpg','#D8C9B5','砂色 Suna-iro','warm sand · done in mockup'],
['P49 Ski Brake','projects/p49-ski-brake/cover.jpg','#E8D3D1','灰桜 Haizakura','ash cherry · red pops'],
['Spent Packaging','projects/spent/cover.jpg','#888E7E','利休鼠 Rikyū-nezumi','tea-master grey-green'],
['BVM Ventilator','projects/bvm-ventilator/cover.jpg','#5F7290','藍鼠 Ai-nezumi','keep current'],
['Trimble LiDAR','projects/trimble-lidar/cover.jpg','#DDBB99','白茶 Shiracha','pale tea · silver pops'],
['Wren','projects/wren/cover.jpg','#C39143','黄土 Ōdo','ochre · echoes gold ring'],
['Clarity Water Pump','projects/clarity-pump/cover.jpg','#926262','蘇芳香 Suōkō','keep current'],
['Flavor Bottle','projects/flavor-bottle/cover.jpg','#C1693C','樺色 Kaba-iro','keep, slightly muted'],
['Kohler Splash','projects/kohler-splash/cover.jpg','#2B4B65','藍色 Ai-iro','deep indigo · glass glows'],
['Canyon House','projects/canyon-house/cover.jpg','#C1E4E9','白藍 Shiro-ai','pale mountain sky'],
['Loft House','projects/loft-house/cover.jpg','#D6E9CA','白緑 Byakuroku','pale leaf · getaway']];
document.getElementById('g').innerHTML=P.map(([n,img,c,j,note])=>`<div class="c"><img src="../../images/${img}"><div class="sw"><i style="background:${c}"></i><div><b>${n}</b><small>${j} · ${c} · ${note}</small></div></div></div>`).join('');
</script></body></html>
