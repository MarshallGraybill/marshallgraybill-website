<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept A · Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#111; --ink:#f2f2f2; --dim:#8a8a8a; --gap:8px; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:300 16px/1.5 "Jost", "Futura", sans-serif; }
  a { color:inherit; text-decoration:none; }
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px; padding:44px clamp(16px,4vw,80px) 56px; }
  nav { display:flex; flex-wrap:wrap; gap:4px 28px; font-size:19px; letter-spacing:.04em; text-transform:uppercase; }
  nav a { color:var(--dim); } nav a.on, nav a:hover { color:var(--ink); }
  .name { font-size:clamp(26px,3vw,44px); font-weight:400; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
  .name small { display:block; text-align:center; font-size:12px; letter-spacing:.42em; color:var(--dim); margin-top:6px; }
  .icons { justify-self:end; display:flex; gap:22px; font-size:15px; letter-spacing:.1em; color:var(--dim); }
  .filters { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; padding:0 16px 40px; }
  .filters button { font:400 13px "Jost"; letter-spacing:.18em; text-transform:uppercase; background:none; color:var(--dim);
    border:1px solid #333; border-radius:99px; padding:9px 18px; cursor:pointer; }
  .filters button.on { color:#111; background:var(--ink); border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--gap); padding:0 clamp(16px,4vw,80px) 80px; }
  .tile { position:relative; aspect-ratio:16/9; overflow:hidden; background:#222; }
  .tile img { width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.2,.7,.2,1), filter .5s; }
  .tile .cap { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:28px;
    background:linear-gradient(transparent 45%, rgba(0,0,0,.75)); opacity:0; transition:opacity .4s; }
  .tile:hover img { transform:scale(1.04); }
  .tile:hover .cap, .tile.demo .cap { opacity:1; }
  .cap h3 { margin:0; font-size:26px; font-weight:400; letter-spacing:.02em; }
  .cap span { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:#cfcfcf; }
  .tile.wide { grid-column:span 2; aspect-ratio:21/9; background:#000; }
  .tile.wide img { object-fit:contain; }
  @media (max-width:760px){
    header { grid-template-columns:1fr; text-align:center; } nav, .icons { justify-content:center; justify-self:center; }
    .grid { grid-template-columns:1fr; } .tile.wide { grid-column:auto; aspect-ratio:16/9; }
  }
</style>
</head>
<body>
<header>
  <nav><a class="on" href="#">Work</a><a href="#">Research</a><a href="#">Publications</a><a href="#">CV</a><a href="#">About</a></nav>
  <div class="name">Marshall Graybill<small>Design · Engineering · Science</small></div>
  <div class="icons"><a href="#">IN</a><a href="#">✉</a></div>
</header>
<div class="filters">
  <button class="on">All</button><button>Industrial Design</button><button>Engineering</button><button>Science</button>
</div>
<main class="grid">
  <a class="tile wide demo" href="#"><img src="img/mechanism.jpg" alt=""><div class="cap"><span>PhD Research · Featured</span><h3>Research Instrument</h3></div></a>
  <a class="tile" href="#"><img src="img/drone.jpg" alt=""><div class="cap"><span>Engineering</span><h3>Aerial Vehicle</h3></div></a>
  <a class="tile" href="#"><img src="img/hex.jpg" alt=""><div class="cap"><span>Industrial Design</span><h3>Hex Tile System</h3></div></a>
  <a class="tile" href="#"><img src="img/binding.jpg" alt=""><div class="cap"><span>Industrial Design</span><h3>Binding Mechanism</h3></div></a>
  <a class="tile" href="#"><img src="img/drone.jpg" alt="" style="filter:hue-rotate(140deg)"><div class="cap"><span>Engineering</span><h3>Next Project</h3></div></a>
</main>
</body>
</html>
