<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept A · Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#111; --ink:#f2f2f2; --dim:#8a8a8a; --gap:8px; --tile:#222; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:300 16px/1.5 "Jost", "Futura", sans-serif; }
  a { color:inherit; text-decoration:none; }
  header { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:24px; padding:44px clamp(16px,4vw,80px) 56px; }
  nav { display:flex; flex-wrap:wrap; gap:4px 28px; font-size:19px; letter-spacing:.04em; text-transform:uppercase; }
  nav a { color:var(--dim); } nav a.on, nav a:hover { color:var(--ink); }
  .name { font-size:clamp(26px,3vw,44px); font-weight:400; letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }
  .icons { justify-self:end; display:flex; gap:22px; font-size:15px; letter-spacing:.1em; color:var(--dim); }
  .filters { display:flex; justify-content:center; flex-wrap:wrap; gap:4px 28px; padding:0 16px 40px; }
  .filters button { font:300 19px "Jost", "Futura", sans-serif; letter-spacing:.04em; text-transform:uppercase;
    background:none; border:0; padding:0; color:var(--dim); cursor:pointer; }
  .filters button.on, .filters button:hover { color:var(--ink); }
  .tile.hide { display:none; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--gap); padding:0 clamp(16px,4vw,80px) 80px; }
  .tile { position:relative; aspect-ratio:16/9; overflow:hidden; background:var(--tile); }
  .tile img { width:100%; height:100%; object-fit:cover; transition:transform .8s cubic-bezier(.2,.7,.2,1), filter .5s; }
  .tile .cap { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:28px;
    background:linear-gradient(transparent 45%, rgba(0,0,0,.75)); opacity:0; transition:opacity .4s; }
  .tile:hover img { transform:scale(1.04); }
  .tile:hover .cap, .tile.demo .cap { opacity:1; }
  .cap h3 { margin:0; font-size:26px; font-weight:400; letter-spacing:.02em; }
  .cap span { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:#cfcfcf; }
  @media (max-width:760px){
    header { grid-template-columns:1fr; text-align:center; } nav, .icons { justify-content:center; justify-self:center; }
    .grid { grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<header>
  <nav><a class="on" href="#">Work</a><a href="#">Research</a><a href="#">Publications</a><a href="#">CV</a><a href="#">About</a></nav>
  <div class="name">Marshall Graybill</div>
  <div class="icons"><a href="#">IN</a><a href="#">✉</a></div>
</header>
<div class="filters">
  <button class="on" data-f="all">All</button><button data-f="id">Industrial Design</button><button data-f="eng">Engineering</button><button data-f="sci">Science</button>
</div>
<main class="grid">
  <a class="tile" href="#" data-tags="eng sci"><img src="img/mechanism.jpg" alt=""><div class="cap"><span>Engineering · Science</span><h3>Research Instrument</h3></div></a>
  <a class="tile" href="#" data-tags="eng"><img src="img/drone.jpg" alt=""><div class="cap"><span>Engineering</span><h3>Aerial Vehicle</h3></div></a>
  <a class="tile" href="#" data-tags="id"><img src="img/binding.jpg" alt=""><div class="cap"><span>Industrial Design</span><h3>Binding Mechanism</h3></div></a>
  <a class="tile" href="#" data-tags="id"><img src="img/hex.jpg" alt=""><div class="cap"><span>Industrial Design</span><h3>Hex Tile System</h3></div></a>
</main>
<script>
  const btns=document.querySelectorAll('.filters button'), tiles=document.querySelectorAll('.tile');
  btns.forEach(b=>b.addEventListener('click',()=>{
    btns.forEach(x=>x.classList.toggle('on',x===b));
    tiles.forEach(t=>t.classList.toggle('hide', b.dataset.f!=='all' && !t.dataset.tags.split(' ').includes(b.dataset.f)));
  }));
</script>
</body>
</html>
